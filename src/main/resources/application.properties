# Default fallback properties
logging.level.root=OFF
logging.level.so.fox.nodechain=INFO

spring.application.name=nodechain
spring.config.import=optional:file:./server.properties
server.port=8080
node.p2p.port=9090
node.db.path=sqlite.db
blockchain.chain-id=foxchain-main-1
